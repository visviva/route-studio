<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101616">
    <meta name="description" content="Convert World of Warcraft waypoints for SC Farming Paths and preview them on a map.">
    <base href="/">
    <link rel="icon" type="image/svg+xml" href="compass.svg">
    <link rel="stylesheet" href="studio.css">
    <title>Route Studio · SC Farming Paths</title>
</head>
<body>
    <div id="app">
        <div class="boot-screen" role="status">
            <img src="compass.svg" alt="" width="42" height="42">
            <p data-text="Loading">Loading Route Studio…</p>
        </div>
    </div>
    <div id="blazor-error-ui" role="alert">
        <span data-text="StartupError">Route Studio stopped running.</span> <a href="" class="reload" data-text="Reload">Reload</a>
    </div>
    <noscript>Route Studio requires JavaScript and WebAssembly.</noscript>
    <script src="text-catalog.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script src="studio.js"></script>
</body>
</html>
