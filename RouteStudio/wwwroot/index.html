<!doctype html>
<html lang="de">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="World-of-Warcraft-Wegpunkte für SC Farming Paths konvertieren und auf einer Karte ansehen.">
    <base href="/">
    <link rel="icon" type="image/svg+xml" href="compass.svg">
